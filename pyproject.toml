[project]
name = "migra"
version = "4.0.0"
description = "Like `diff` but for PostgreSQL schemas"
authors = [{ name = "Robert Lechte", email = "robertlechte@gmail.com" }]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "Unlicense"
dependencies = [
    "sqlbag",
    "six",
    "schemainspect",
    "networkx~=3.1",
]

[project.optional-dependencies]
pg = ["psycopg2"]

[project.urls]
Homepage = "https://databaseci.com/docs/migra"
Repository = "https://github.com/djrobstep/migra"

[project.scripts]
migra = "migra:do_command"

[dependency-groups]
dev = [
    "sqlbag",
    "pytest",
    "pytest-cov",
    "flake8",
    "isort",
    "black",
    "toml",
]

[tool.uv]

[tool.uv.sources]
schemainspect = { path = "../schemainspect", editable = true }
sqlbag = { path = "../sqlbag", editable = true }
#schemainspect = { git = "https://github.com/joshainglis/schemainspect.git", rev = "a3ee1a5922153ae928e19db36f0ca24f9738ef21" }
#sqlbag = { git = "https://github.com/joshainglis/sqlbag", rev="6e9a5e8f176968b83c7756b95ef475ef8c3163af" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
